<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-style="flat" data-range="all">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="2025级医学检验技术专业（1）班 2026年秋季学期课程表">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课程表">
<meta name="format-detection" content="telephone=no">
<title>课程表 · 2025级医学检验技术专业（1）班</title>

<script src="js/boot.js"></script>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-flat.css">
<link rel="stylesheet" href="css/theme-clay.css">
<link rel="stylesheet" href="css/theme-neobrutal.css">
<link rel="stylesheet" href="css/theme-glass.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/segmented.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/today.css">
<link rel="stylesheet" href="css/week-tabs.css">
<link rel="stylesheet" href="css/week-grid.css">
<link rel="stylesheet" href="css/teachers.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ══════════════════════════════ 顶部栏 ══════════════════════════════ -->
<header class="app-header" id="appHeader">
  <div class="header-inner">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="17" rx="3.5"/>
        <path d="M8 2.5v4M16 2.5v4M3 10.5h18"/>
        <circle cx="8.2" cy="15.4" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="15.4" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="15.8" cy="15.4" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
      <div class="brand-text">
        <h1>2025级医学检验技术专业（1）班</h1>
        <p>2026 年秋季学期 · 第 1～6 周</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="segmented" role="radiogroup" aria-label="主题模式">
        <button type="button" class="seg-btn theme-btn" data-pref="light" role="radio"
                aria-checked="false" title="浅色" aria-label="浅色模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
        <button type="button" class="seg-btn theme-btn" data-pref="dark" role="radio"
                aria-checked="false" title="深色" aria-label="深色模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button type="button" class="seg-btn theme-btn" data-pref="system" role="radio"
                aria-checked="false" title="跟随系统" aria-label="跟随系统">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3.5" width="20" height="13.5" rx="2.5"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </button>
      </div>

      <button type="button" class="icon-btn" id="settingsBtn" aria-label="打开设置"
              aria-haspopup="dialog" aria-controls="settingsModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- ══════════════════════════════ 主体 ══════════════════════════════ -->
<main>
  <section id="todayPanel" aria-label="今日课程"></section>

  <nav class="week-tabs" id="weekTabs" role="tablist" aria-label="周次切换"></nav>

  <section id="weekGrid" class="week-grid" aria-label="课程表"></section>

  <section class="teachers" aria-label="任课教师">
    <h2 class="teachers-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      任课教师
    </h2>
    <div class="teacher-grid" id="teacherGrid"></div>
  </section>

  <p class="footnote">数据来源：2025级医学检验技术专业（1）班课程表（2026 年秋季学期）</p>
</main>

<!-- ══════════════════════════════ 设置面板 ══════════════════════════════ -->
<div class="modal-backdrop" id="settingsModal" role="presentation">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        设置
      </h2>
      <button type="button" class="icon-btn" id="closeSettings" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">

      <!-- 主题外观 -->
      <section class="setting-group">
        <h3>主题外观</h3>
        <div class="segmented seg-wide" role="radiogroup" aria-label="主题外观">
          <button type="button" class="seg-btn theme-btn" data-pref="light" role="radio"
                  aria-checked="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            浅色
          </button>
          <button type="button" class="seg-btn theme-btn" data-pref="dark" role="radio"
                  aria-checked="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            深色
          </button>
          <button type="button" class="seg-btn theme-btn" data-pref="system" role="radio"
                  aria-checked="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="3.5" width="20" height="13.5" rx="2.5"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            跟随系统
          </button>
        </div>
      </section>

      <!-- 界面风格 -->
      <section class="setting-group">
        <h3>界面风格</h3>
        <div class="style-grid" role="radiogroup" aria-label="界面风格">

          <button type="button" class="style-btn" data-ui="flat" role="radio" aria-checked="false">
            <span class="style-swatch" data-swatch="flat" aria-hidden="true"></span>
            <span class="style-name">
              现代化扁平卡片
              <svg class="style-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
            </span>
          </button>

          <button type="button" class="style-btn" data-ui="clay" role="radio" aria-checked="false">
            <span class="style-swatch" data-swatch="clay" aria-hidden="true"></span>
            <span class="style-name">
              粘土拟物
              <svg class="style-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
            </span>
          </button>

          <button type="button" class="style-btn" data-ui="neobrutal" role="radio" aria-checked="false">
            <span class="style-swatch" data-swatch="neobrutal" aria-hidden="true"></span>
            <span class="style-name">
              新野兽派
              <svg class="style-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
            </span>
          </button>

          <button type="button" class="style-btn" data-ui="glass" role="radio" aria-checked="false">
            <span class="style-swatch" data-swatch="glass" aria-hidden="true"></span>
            <span class="style-name">
              玻璃拟态
              <svg class="style-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
            </span>
          </button>

        </div>
      </section>

      <!-- 显示范围 -->
      <section class="setting-group">
        <h3>显示范围</h3>
        <div class="segmented seg-wide" role="radiogroup" aria-label="显示范围">
          <button type="button" class="seg-btn range-btn" data-range="all" role="radio"
                  aria-checked="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="17" rx="3"/>
              <path d="M8 2.5v4M16 2.5v4M3 10.5h18"/>
            </svg>
            全部天数
          </button>
          <button type="button" class="seg-btn range-btn" data-range="today" role="radio"
                  aria-checked="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7.5v5l3.2 2"/>
            </svg>
            仅今天
          </button>
        </div>
        <p class="setting-hint">
          选择「仅今天」后，页面只显示当天课程，并自动隐藏周次切换栏。
        </p>
      </section>

      <!-- 说明 -->
      <div class="info-strip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 16v-4.5M12 8.2h.01"/>
        </svg>
        <span>所有偏好保存在本机浏览器中，下次打开自动恢复。本页面支持添加到主屏幕，离线也能查看课表。</span>
      </div>

    </div>
  </div>
</div>

<!-- 模块脚本：按序加载，顺序不可打乱（各模块共享全局作用域，init.js 最后执行初始化） -->
<script src="js/lifecycle.js"></script>
<script src="js/data.js"></script>
<script src="js/date.js"></script>
<script src="js/prefs.js"></script>
<script src="js/dom.js"></script>
<script src="js/theme.js"></script>
<script src="js/style.js"></script>
<script src="js/range.js"></script>
<script src="js/render-today.js"></script>
<script src="js/render-tabs.js"></script>
<script src="js/render-grid.js"></script>
<script src="js/render-teachers.js"></script>
<script src="js/week-state.js"></script>
<script src="js/header-scroll.js"></script>
<script src="js/settings-modal.js"></script>
<script src="js/events.js"></script>
<script src="js/pwa.js"></script>
<script src="js/init.js"></script>
</body>
</html>
